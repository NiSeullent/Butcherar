name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 binutils-mingw-w64 \
                                  p7zip-full zip zlib1g-dev
          pip install pyzipper

      - name: Build GogitZip.exe (x86, Windows 2000+) and GogitZip64.exe (x64)
        run: make -j"$(nproc)"

      - name: Check Windows 2000 compatibility of the 32-bit PE header
        run: |
          i686-w64-mingw32-objdump -p build/GogitZip.exe | grep -E "MajorOSystemVersion\s+5|MajorSubsystemVersion\s+5"
          ! i686-w64-mingw32-objdump -p build/GogitZip.exe | grep -i "msvcrt"

      - name: Core tests (zlib cross-check, fuzzing, archive regression)
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: GogitZip
          path: build/*.exe

      - name: Prepare release notes and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd build && sha256sum GogitZip.exe GogitZip64.exe) > build/SHA256SUMS.txt
          {
            cat .github/release-notes.md
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat build/SHA256SUMS.txt
            echo '```'
          } > build/release-body.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 고깃ZIP ${{ github.ref_name }}
          body_path: build/release-body.md
          files: |
            build/GogitZip.exe
            build/GogitZip64.exe
            build/SHA256SUMS.txt
