name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # a release published in the GitHub UI under any tag name ("release", "1.0", ...)
  release:
    types: [published]
  # attach binaries to an existing release by hand: Actions > build > Run workflow
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to build and attach binaries to (e.g. release, v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # tag whose release gets the binaries; empty = ordinary CI build, nothing published
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag
         || (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'v')) && github.event.release.tag_name
         || startsWith(github.ref, 'refs/tags/v') && github.ref_name
         || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a manual run builds exactly the tagged source
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Install MinGW-w64 and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 binutils-mingw-w64 \
                                  p7zip-full zip zlib1g-dev
          pip install pyzipper

      - name: Build GogitZip.exe (x86, Windows 2000+) and GogitZip64.exe (x64)
        run: make -j"$(nproc)"

      - name: Check Windows 2000 compatibility of the 32-bit PE header
        run: |
          i686-w64-mingw32-objdump -p build/GogitZip.exe | grep -E "MajorOSystemVersion\s+5|MajorSubsystemVersion\s+5"
          ! i686-w64-mingw32-objdump -p build/GogitZip.exe | grep -i "msvcrt"

      - name: Core tests (zlib cross-check, fuzzing, archive regression)
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: GogitZip
          path: build/*.exe

      - name: Prepare release notes and checksums
        if: env.RELEASE_TAG != ''
        run: |
          (cd build && sha256sum GogitZip.exe GogitZip64.exe) > build/SHA256SUMS.txt
          {
            cat .github/release-notes.md
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat build/SHA256SUMS.txt
            echo '```'
          } > build/release-body.md

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # keep the title of a release made in the UI; name new tag-push releases
          name: ${{ github.event_name == 'push' && format('고깃ZIP {0}', github.ref_name) || '' }}
          body_path: build/release-body.md
          files: |
            build/GogitZip.exe
            build/GogitZip64.exe
            build/SHA256SUMS.txt
