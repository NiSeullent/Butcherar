name: build

# Every push and pull request: Windows build, the test suite on Linux (x86_64 and ARM64),
# Linux packages (x86_64, aarch64) and the macOS app.
# Releases: a published release (any tag: "release", "2.0", ...) or a pushed v* tag gets
# every package, SHA256SUMS.txt and .github/release-notes.md as its description.
# Actions > build > Run workflow with a tag rebuilds that tag and replaces the assets of
# its (existing) release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to build and attach the packages to (e.g. v2.0.0, release)"
        required: true

permissions:
  contents: write

# a manual run builds exactly the tagged source: every job checks out
#   ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
# (empty = the commit or tag that triggered the run)

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (x86 + x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 binutils-mingw-w64

      - name: Build GogitZip.exe (x86, Windows 2000+) and GogitZip64.exe (x64)
        run: |
          set -o pipefail
          make -j"$(nproc)" win 2>&1 | tee build-win.log
          if grep -q "warning:" build-win.log; then echo "::error::compiler warnings"; exit 1; fi

      - name: Check Windows 2000 compatibility of the 32-bit PE header
        run: |
          i686-w64-mingw32-objdump -p build/GogitZip.exe | grep -E "MajorOSystemVersion\s+5|MajorSubsystemVersion\s+5"
          # no C runtime DLL in either import table
          if i686-w64-mingw32-objdump -p build/GogitZip.exe | grep -qi "msvcrt"; then exit 1; fi
          if x86_64-w64-mingw32-objdump -p build/GogitZip64.exe | grep -qi "msvcrt"; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: GogitZIP-windows
          path: |
            build/GogitZip.exe
            build/GogitZip64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- tests
  # The whole suite (tests/cases/*.py). Every reference tool the tests call is installed;
  # a test whose tool is missing skips itself. Not installed: wine (app_windows.py) and
  # qemu-system-x86 (booting a test ISO in writer_iso.py), both optional.
  # ARM64 runs natively on the ARM runner; it does not block a release (continue-on-error).
  linux-test:
    name: tests (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, extra: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user" }
          - { arch: aarch64, os: ubuntu-24.04-arm, extra: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Install build and test tools
        env:
          PKGS: >-
            build-essential pkg-config libgtk-3-dev zlib1g-dev python3-dev python3-pip
            gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 binutils-mingw-w64 clang lld llvm
            7zip zip unzip xz-utils bzip2 zstd lz4 lzip lzop ncompress brotli
            cabextract gcab cpio rpm nsis lhasa arj unar unalz rar unrar wimtools
            libarchive-tools innoextract icoutils upx-ucl osslsigncode msitools wixl mscompress
            lzfse libchm-bin fp-utils dmg2img android-sdk-libsparse-utils
            xorriso genisoimage squashfs-tools udftools mtools dosfstools e2fsprogs ntfs-3g
            hfsprogs hfsutils apfsprogs qemu-utils fdisk gdisk util-linux
            xvfb xdotool imagemagick desktop-file-utils
            ${{ matrix.extra }}
        run: |
          sudo apt-get update
          # one transaction; if a package does not exist on this runner, install the rest one by one
          # shellcheck disable=SC2086
          if ! sudo apt-get install -y --no-install-recommends $PKGS; then
            for p in $PKGS; do
              sudo apt-get install -y --no-install-recommends "$p" || echo "::warning::package $p is not available"
            done
          fi
          for m in pyzipper pyppmd pyliblzfse py7zr pycdlib rarfile xxhash dissect.util cryptography pillow; do
            python3 -m pip install --user --break-system-packages "$m" || echo "::warning::pip package $m failed"
          done
          7z | head -n 2

      - name: Build
        run: make -j"$(nproc)" build/test_inflate build/gzt build/gogitzip linux

      - name: Test suite
        timeout-minutes: 100
        run: make test

  # ---------------------------------------------------------------- Linux packages
  # Built on Ubuntu 22.04 so the programs run on glibc 2.35 and newer.
  linux-package:
    name: Linux package (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb: amd64, os: ubuntu-22.04 }
          - { arch: aarch64, deb: arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Install GTK 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev dpkg-dev

      - name: Build gogitzip and gogitzip-gtk
        run: make -j"$(nproc)" linux HOST_CFLAGS="-O2"

      - name: Smoke test
        run: |
          build/gogitzip --version
          build/linux/gogitzip-gtk --version
          build/gogitzip i
          mkdir -p "$RUNNER_TEMP/s/in/폴더" && seq 100000 > "$RUNNER_TEMP/s/in/폴더/숫자.txt"
          for f in zip 7z tar.xz; do
            build/gogitzip a -bd "$RUNNER_TEMP/s/t.$f" "$RUNNER_TEMP/s/in/폴더"
            build/gogitzip t -bd "$RUNNER_TEMP/s/t.$f"
            build/gogitzip x -bd -y -o "$RUNNER_TEMP/s/out-$f" "$RUNNER_TEMP/s/t.$f"
            cmp "$RUNNER_TEMP/s/in/폴더/숫자.txt" "$RUNNER_TEMP/s/out-$f/폴더/숫자.txt"
          done

      - name: make dist-linux deb
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" make dist-linux deb HOST_CFLAGS="-O2"

      - name: Check the packages
        run: |
          ls -l build/dist
          tgz=$(ls build/dist/GogitZIP-*-linux-${{ matrix.arch }}.tar.gz)
          deb=$(ls build/dist/gogitzip_*_${{ matrix.deb }}.deb)
          # glibc baseline of the prebuilt programs
          need=$(objdump -T build/linux/gogitzip-gtk build/gogitzip | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -n 1)
          echo "highest glibc symbol version: $need"
          [ "$(printf '%s\n2.35\n' "$need" | sort -V | tail -n 1)" = 2.35 ]
          # tarball: install into a prefix, run, uninstall
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          pkg=$(ls -d "$RUNNER_TEMP"/GogitZIP-*-linux-${{ matrix.arch }})
          "$pkg/install.sh" --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/gogitzip" i | head -n 3
          "$RUNNER_TEMP/prefix/bin/gogitzip-gtk" --version
          "$RUNNER_TEMP/prefix/share/gogitzip/uninstall.sh"
          [ ! -e "$RUNNER_TEMP/prefix/bin/gogitzip" ]
          # .deb: install with apt (pulls the dependencies), run, remove
          dpkg-deb --info "$deb"
          sudo apt-get install -y "./$deb"
          gogitzip --version
          gogitzip-gtk --version
          sudo apt-get remove -y gogitzip

      - uses: actions/upload-artifact@v4
        with:
          name: GogitZIP-linux-${{ matrix.arch }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS
  # universal GogitZIP.app (x86_64 10.13+, arm64 11+) + command line tool, disk image,
  # then the core test suite on Apple silicon (tests whose tools are missing skip themselves)
  macos:
    name: macOS (universal)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Install test tools
        run: |
          brew install xz zstd lz4 lzip lzop cabextract cpio squashfs sevenzip || true
          # the tests call 7-Zip as "7z"; Homebrew's sevenzip installs "7zz"
          if ! command -v 7z >/dev/null && command -v 7zz >/dev/null; then
            ln -s "$(command -v 7zz)" "$(brew --prefix)/bin/7z"
          fi
          python3 -m pip install --break-system-packages pyzipper \
            || python3 -m pip install --user pyzipper || true

      - name: Build GogitZIP.app (universal) and the command line tool
        run: make -j"$(sysctl -n hw.ncpu)" mac

      - name: Check the bundle
        run: |
          app=build/mac/GogitZIP.app
          lipo -archs "$app/Contents/MacOS/GogitZIP"
          lipo "$app/Contents/MacOS/GogitZIP" -verify_arch x86_64 arm64
          lipo "$app/Contents/Helpers/gogitzip" -verify_arch x86_64 arm64
          otool -arch x86_64 -l "$app/Contents/MacOS/GogitZIP" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos 10\.13|version 10\.13"
          otool -arch arm64 -l "$app/Contents/MacOS/GogitZIP" | grep -A4 LC_BUILD_VERSION | grep "minos 11\.0"
          plutil -lint "$app/Contents/Info.plist" "$app"/Contents/Resources/*.lproj/*.strings
          version=$(sed -n 's/^#define GZ_APP_VERSION "\(.*\)"/\1/p' src/core/version.h)
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version" ]
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/GogitZIP" --version | grep -F "$version"
          "$app/Contents/Helpers/gogitzip" --version | grep -F "$version"

      - name: Disk image
        run: make dmg

      - uses: actions/upload-artifact@v4
        with:
          name: GogitZIP-mac
          path: build/GogitZIP-mac.dmg
          if-no-files-found: error

      # Owner decision (2.0.0): a macOS test failure does not hold back the dmg. The failing
      # checks compare against Homebrew's 7zz / BSD tools (Korean passwords, attributes) and
      # are tracked for 2.0.1; the app itself is built, bundle-checked and uploaded above.
      # Linux tests (x86_64 and ARM64) still gate the release.
      - name: Core tests (and the app's command line modes)
        continue-on-error: true
        run: make test

  # ---------------------------------------------------------------- release
  # A v* tag push publishes (or updates) the release of that tag. A release published in
  # the UI under a v* tag is left to the run of its tag push, so the assets go up once.
  release:
    needs: [windows, linux-test, linux-package, macos]
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'v'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag
         || github.event_name == 'release' && github.event.release.tag_name
         || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          ls -l dist
          (cd dist && sha256sum -- * | LC_ALL=C sort -k 2) > SHA256SUMS.txt
          mv SHA256SUMS.txt dist/
          {
            cat .github/release-notes.md
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # keep the title of a release made in the UI; name new tag-push releases
          name: ${{ github.event_name == 'push' && format('고깃ZIP {0}', github.ref_name) || '' }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            dist/GogitZip.exe
            dist/GogitZip64.exe
            dist/GogitZIP-*-linux-x86_64.tar.gz
            dist/GogitZIP-*-linux-aarch64.tar.gz
            dist/gogitzip_*_amd64.deb
            dist/gogitzip_*_arm64.deb
            dist/GogitZIP-mac.dmg
            dist/SHA256SUMS.txt
